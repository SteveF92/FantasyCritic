name: Build and unit test
description: >-
  Builds the Web project, regenerates both NSwag clients from its OpenAPI surface, builds
  the rest of the solution against them, and runs the unit tests. Integration tests are
  deliberately not run here — they need a MySQL container and take about six minutes.

inputs:
  configuration:
    description: MSBuild configuration.
    required: false
    default: Release

runs:
  using: composite
  steps:
    # The Verify fixtures under src/FantasyCritic.Test/TestData are LFS-backed CSVs, about
    # 135 MB of them. actions/checkout leaves pointer files behind by default, and the test
    # fixtures then parse "version https://git-lfs.github.com/spec/v1" as CSV and fail.
    #
    # Caching the objects rather than passing `lfs: true` to checkout keeps repeat runs off
    # GitHub's LFS bandwidth quota. A plain LFS checkout would pull all 135 MB on every run
    # of every pull request, and LFS starts refusing downloads outright once the quota is
    # spent — which would look like this same failure, but intermittently.
    - name: List LFS objects
      shell: bash
      run: git lfs ls-files --long | cut -d' ' -f1 | sort > .lfs-assets-id

    - name: Restore LFS cache
      uses: actions/cache@v4
      with:
        path: .git/lfs
        key: lfs-${{ hashFiles('.lfs-assets-id') }}
        # A partial hit still saves most of the download: `git lfs pull` below fetches only
        # whatever the cached set is missing.
        restore-keys: lfs-

    - name: Check out LFS objects
      shell: bash
      run: |
        git lfs pull
        rm -f .lfs-assets-id

    - name: Create log directory
      # LoggingPaths hard-codes /var/log/fantasy-critic on Linux, and the unit test fixture
      # configures Serilog file sinks against it.
      shell: bash
      run: |
        sudo mkdir -p /var/log/fantasy-critic
        sudo chown -R "$(id -u):$(id -g)" /var/log/fantasy-critic

    - name: Restore solution
      shell: bash
      run: dotnet restore src/FantasyCritic.slnx

    - name: Build Web
      # Must precede client generation: nswag.json runs with noBuild, so it reads the
      # already-compiled Web assembly to produce the OpenAPI document.
      shell: bash
      run: dotnet build src/FantasyCritic.Web/FantasyCritic.Web.csproj -c ${{ inputs.configuration }} --no-restore

    - name: Generate API clients
      # Both generated clients are gitignored, so CI has to produce them the same way the
      # server used to. The C# client is what makes FantasyCritic.IntegrationTests compile.
      shell: bash
      env:
        NSWAG_CONFIGURATION: ${{ inputs.configuration }}
      run: bash scripts/regenerate-api-client.sh

    - name: Build solution
      shell: bash
      run: dotnet build src/FantasyCritic.slnx -c ${{ inputs.configuration }} --no-restore

    - name: Unit tests
      shell: bash
      run: >-
        dotnet test src/FantasyCritic.Test/FantasyCritic.Test.csproj
        -c ${{ inputs.configuration }}
        --no-build
        --logger "console;verbosity=normal"
        --logger "trx;LogFileName=unit-tests.trx"
        --results-directory ${{ github.workspace }}/test-results

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
        path: test-results/
        if-no-files-found: ignore
        retention-days: 14
