name: CI

# Builds and tests every push to main and every pull request (including forks).
# This does not deploy anything — see deploy.yml for that.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build

      - name: Build and test
        uses: ./.github/actions/build-and-test

      - name: Check formatting and lint
        # Runs after the build so the generated clients exist; `dotnet format style`
        # needs a compilable solution.
        run: bash scripts/format.sh --check

  vulnerability-scan:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory only. A newly-published advisory against a transitive package should not
    # block a pull request; it should show up in the job summary and get looked at.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-build
        with:
          install-client-packages: 'false'

      - name: Restore
        run: dotnet restore src/FantasyCritic.slnx

      - name: NuGet vulnerabilities
        run: |
          # `dotnet list package` can no longer read the solution: it misidentifies the
          # JavaScript project (.esproj) as a packages.config project, reports that, and
          # stops -- silently skipping every project that sorts after it. So scan the C#
          # projects one at a time.
          #
          # The list comes from the solution rather than from `find` so it cannot drift:
          # a project added to the solution is scanned automatically, and a stray .csproj
          # left on disk but not in the solution is not. Paths are relative to the solution
          # directory and use the host separator, hence the src/ prefix and the backslash
          # replacement (a no-op on Linux, correct on Windows for local testing).
          : > /tmp/nuget-vulns.txt
          scan_failed=0
          scanned=0
          while IFS= read -r proj; do
            proj="src/${proj//\\//}"
            scanned=$((scanned + 1))
            if ! dotnet list "$proj" package --vulnerable --include-transitive >> /tmp/nuget-vulns.txt 2>&1; then
              scan_failed=1
            fi
          done < <(dotnet sln src/FantasyCritic.slnx list | grep '\.csproj$')

          # An empty list would otherwise sail through as a clean scan, which is the exact
          # failure this step is meant to stop having.
          if [ "$scanned" -eq 0 ]; then
            echo "::error::No projects were scanned - could not read the project list from the solution."
            exit 1
          fi
          echo "Scanned $scanned project(s)."

          {
            echo "## NuGet"
            echo
            echo '```'
            cat /tmp/nuget-vulns.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if grep -q "has the following vulnerable packages" /tmp/nuget-vulns.txt; then
            echo "::warning::Vulnerable NuGet packages found. See the job summary."
          fi
          if [ "$scan_failed" -ne 0 ]; then
            echo "::warning::At least one project could not be scanned. See the job summary."
          fi

      - name: npm vulnerabilities
        working-directory: src/FantasyCritic.ClientAppVue2
        run: |
          {
            echo "## npm"
            echo
            echo '```'
            npm audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
