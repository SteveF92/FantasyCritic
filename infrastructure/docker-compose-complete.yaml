# Full local stack: MySQL, migrator, seed data, web app and Discord bot.
#
#   docker compose -f infrastructure/docker-compose-complete.yaml up
#
# Build contexts are the repository root, not src/, because the web image has to run NSwag to
# generate the TypeScript client the Vue build imports, and the NSwag tool manifest lives in
# .config/ above src/. See src/FantasyCritic.Web/Dockerfile.

services:
  mysql:
    image: mysql:8.4
    container_name: fantasycritic-mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fantasycritic
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql-init-multiple-users.sql:/docker-entrypoint-initdb.d/01-multiple-users.sql:ro
    # Keep auth + charset compatible with typical MySQL client expectations.
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--require_secure_transport=ON"
    healthcheck:
      test:
        - "CMD-SHELL"
        - "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --ssl-mode=REQUIRED"
      interval: 5s
      timeout: 5s
      retries: 20

  database-updater:
    container_name: fantasycritic-database-updater
    build:
      context: ..
      dockerfile: src/FantasyCritic.DatabaseUpdater/Dockerfile
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Development skips AWS Secrets Manager (same pattern as web below).
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AdminConnection: "Server=mysql;Port=3306;Database=fantasycritic;Uid=fantasycritic-admin;Pwd=anotherfantasticpassword;SslMode=required;charset=utf8;"
    volumes:
      # Mount scripts from the host so new/changed SQL files are picked up without
      # rebuilding the image. GetScriptsRoot() resolves /app/Scripts first.
      - ../src/FantasyCritic.DatabaseUpdater/Scripts:/app/Scripts:ro

  local-database-tool:
    container_name: fantasycritic-local-database-tool
    build:
      context: ..
      dockerfile: src/FantasyCritic.LocalDatabaseTool/Dockerfile
    restart: "no"
    depends_on:
      database-updater:
        condition: service_completed_successfully
    environment:
      localConnectionString: "Server=mysql;Port=3306;Database=fantasycritic;Uid=fantasycritic;Pwd=afantasticpassword;SslMode=required;charset=utf8;"
      baseAddress: "https://www.fantasycritic.games"
      addedByUserIDOverride: "00000000-0000-0000-0000-000000000000"

  web:
    container_name: fantasycritic-web
    build:
      context: ..
      dockerfile: src/FantasyCritic.Web/Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      database-updater:
        condition: service_completed_successfully
      # Was `master-game-updater`, a service this file has not defined since that one was
      # renamed — compose refuses to start at all on a dependency it cannot resolve.
      local-database-tool:
        condition: service_completed_successfully
    environment:
      # Mirrors src/FantasyCritic.Web/appsettings.json (ASP.NET Core: nested keys use __).
      # Development avoids loading AWS Secrets Manager inside the container.
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      AllowedHosts: "*"
      # appsettings uses localhost:3307 for the host; in Compose the DB service is `mysql`.
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=fantasycritic;Uid=fantasycritic;Pwd=afantasticpassword;SslMode=required;charset=utf8;"
      Logging__LogLevel__Default: Trace
      Logging__LogLevel__Microsoft: Warning
      Logging__LogLevel__Microsoft.Hosting.Lifetime: Information
      AWS__rdsInstanceName: secret
      AWS__region: us-east-1
      Mailgun__apiKey: secret
      Postmark__apiKey: secret
      OpenCritic__apiKey: key
      Authentication__Google__ClientId: secret
      Authentication__Google__ClientSecret: secret
      Authentication__Microsoft__ClientId: secret
      Authentication__Microsoft__ClientSecret: secret
      Authentication__Twitch__ClientId: secret
      Authentication__Twitch__ClientSecret: secret
      Authentication__Patreon__ClientId: secret
      Authentication__Patreon__ClientSecret: secret
      Authentication__Discord__ClientId: secret
      Authentication__Discord__ClientSecret: secret
      PatreonService__AccessToken: secret
      PatreonService__RefreshToken: secret
      PatreonService__CampaignID: secret
      BotToken: secret
      # Public URL when using published port 8080 (VS dev uses https://localhost:44477 in appsettings).
      BaseAddress: http://localhost:8080
      RootFolder: "C:\\FantasyCritic"
      LinuxRootFolder: /var/lib/fantasy-critic

  discord-bot:
    container_name: fantasycritic-discord-bot
    build:
      context: ..
      dockerfile: src/FantasyCritic.DiscordBot/Dockerfile
    # Off by default. The bot exits immediately unless a real token is configured, and a
    # second gateway session on the production token would handle live slash commands from a
    # developer's machine. Start it deliberately:
    #   docker compose -f infrastructure/docker-compose-complete.yaml --profile bot up
    profiles: [bot]
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      database-updater:
        condition: service_completed_successfully
    environment:
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql;Port=3306;Database=fantasycritic;Uid=fantasycritic;Pwd=afantasticpassword;SslMode=required;charset=utf8;"
      AWS__region: us-east-1
      BaseAddress: http://localhost:8080
      # Override with a development bot's token to actually connect.
      BotToken: secret
      # Restricts slash command registration to one server while developing.
      # DevDiscordServerId: "000000000000000000"

volumes:
  mysql_data:
