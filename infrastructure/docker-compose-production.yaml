# The deployed stack. Ships inside the release bundle and lands on the instance as
# /opt/fantasy-critic/docker-compose.yaml, next to the .env file that supplies every variable
# below. Used on both the production and beta instances — they differ only by that .env.
#
# There is no MySQL service here: the database is RDS. There are no secrets here either. Each
# process loads the environment's JSON blob from AWS Secrets Manager at startup, which is why
# only Aws__Region and the environment name need to be set. That requires the containers to
# reach the instance IAM role through IMDSv2, which needs the instance metadata hop limit
# raised to 2 — the single most likely first-deploy failure. See the Phase 3 runbook.
#
# Deploying is deploy/deploy.sh. By hand:
#   cd /opt/fantasy-critic
#   docker compose pull
#   docker compose run --rm database-updater
#   docker compose up -d web discord-bot worker

name: fantasy-critic

services:
  # Run as a one-off job before the app starts, never as a long-running service. Migrations
  # are deliberately not expand/contract compatible, so the web app must be down first.
  database-updater:
    image: ${ECR_REGISTRY}/fantasycritic-database-updater:${IMAGE_TAG}
    restart: "no"
    # Behind a profile so that a bare `docker compose up -d` cannot run migrations. Without it
    # the migrator is an ordinary service and that command starts it against the live database
    # while the site is up, which is the most expensive typo available on this box. Explicitly
    # targeting it still works and does not need the profile named:
    #   docker compose run --rm database-updater
    # Anything that pulls images, though, does need it — a plain `pull` silently skips profiled
    # services, which would move the migrator's download inside the downtime window.
    profiles: [migrate]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Aws__Region: ${AWS_REGION}
    volumes:
      - /var/log/fantasy-critic:/var/log/fantasy-critic

  # One-off commands for deploy.sh, which has no database access of its own. It uses them to
  # wait for the job worker's running job before stopping anything:
  #   docker compose run --rm -T command-line worker-should-pull
  # Behind a profile for the same reason as the migrator: `up -d` must never start it. And as
  # with the migrator, that means a pull has to name the profile or it skips this image.
  command-line:
    image: ${ECR_REGISTRY}/fantasycritic-command-line:${IMAGE_TAG}
    restart: "no"
    profiles: [tools]
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      Aws__Region: ${AWS_REGION}
    volumes:
      - /var/log/fantasy-critic:/var/log/fantasy-critic

  web:
    image: ${ECR_REGISTRY}/fantasycritic-web:${IMAGE_TAG}
    restart: unless-stopped
    # Bound to loopback: nginx on the host reverse-proxies to it (infrastructure/api_proxy.conf
    # already points at 127.0.0.1:5000), and nothing else should reach Kestrel directly. Keeping
    # the port means nginx and the Phase 2 maintenance snippet need no changes at all.
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      Aws__Region: ${AWS_REGION}
      # Where the admin monitor asks the other two containers for their health: by service
      # name, on the compose network. The appsettings defaults are localhost ports for dev.
      ServiceHealth__WorkerUrl: http://worker:8080
      ServiceHealth__DiscordBotUrl: http://discord-bot:8080
    volumes:
      - /var/log/fantasy-critic:/var/log/fantasy-critic
      # The admin console reports which release is live. The file is written by the deploy
      # script rather than baked into the image, because deploy.sh appends deployed_at to it
      # after the image was built.
      - /opt/fantasy-critic/RELEASE:/app/RELEASE:ro

  # Slash commands only. The web app keeps DiscordPushService on the same bot token, so this
  # must stay at exactly one replica — two would answer every command twice.
  #
  # It listens on 8080 only to answer GET /health, and publishes no port: the web app's admin
  # monitor reaches it by service name on the compose network, and the healthcheck below runs
  # inside the container. On this host an unhealthy container is only *labelled* (docker ps,
  # docker inspect) — compose does not restart it. Under ECS the same command is what gets an
  # unhealthy task replaced.
  discord-bot:
    image: ${ECR_REGISTRY}/fantasycritic-discord-bot:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      Aws__Region: ${AWS_REGION}
    volumes:
      - /var/log/fantasy-critic:/var/log/fantasy-critic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3

  # The job system (Phase 4b): the scheduler that decides what is due, the runner that executes
  # it and the canceller that stops it. Cron scheduling left the web process when this shipped,
  # so with this container down *nothing scheduled runs at all* — no public bidding emails, no
  # releasing-this-week posts, no trade expiry — and the site gives no sign of it. deploy.sh
  # checks that it came up for exactly that reason.
  #
  # One replica. The scheduler's inserts are protected by a unique constraint and the runner
  # claims a row with a conditional update, so a second one would not double-run jobs, but
  # nothing here is built to need one: if jobs start queueing behind each other, add runner
  # loops inside the container rather than a second container.
  #
  # Port 8080 and the healthcheck are as for the bot above. Healthy here means the runner has
  # read the database within the last minute or is inside a job — not merely that the process
  # is up.
  worker:
    image: ${ECR_REGISTRY}/fantasycritic-worker:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      ASPNETCORE_URLS: http://+:8080
      Aws__Region: ${AWS_REGION}
    volumes:
      - /var/log/fantasy-critic:/var/log/fantasy-critic
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "5", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      start_period: 30s
      retries: 3
