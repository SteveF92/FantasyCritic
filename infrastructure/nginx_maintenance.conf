# Maintenance page. Include this once inside each `server` block that proxies to the app:
#
#     include /etc/nginx/maintenance.conf;
#
# It does two things:
#
#   1. Turns the bad gateway users would otherwise see during a deploy (the app is stopped
#      while migrations run) into the branded page at /var/www/maintenance/maintenance.html.
#   2. Lets that page be forced on for planned work by creating the flag file
#      /var/www/maintenance.on. The flag is tested per request, so switching it is a `touch`
#      or an `rm` with no nginx reload.
#
# `maintenance.sh on|off` is the supported way to flip it; the deploy script calls it either
# side of the stop/migrate/start window.

# --------------------------------------------------------------------------------------
# The flag
# --------------------------------------------------------------------------------------
# `if` at server level using only `set` and `return` is the pair of cases documented as
# safe, so this is not the notorious `if` inside `location`.
#
# The middle test is what stops an internal redirection cycle. `error_page` below re-enters
# the server rewrite phase with the new URI, which would otherwise hit `return 503` again
# and bounce until nginx gives up at ten redirects.

set $maintenance 0;

if (-f /var/www/maintenance.on) {
    set $maintenance 1;
}

if ($uri = /__maintenance.html) {
    set $maintenance 0;
}

if ($maintenance) {
    return 503;
}

# --------------------------------------------------------------------------------------
# The page
# --------------------------------------------------------------------------------------
# `=503` normalises the bad gateway to a 503, which is the honest status for "down on
# purpose, come back shortly" and the one search engines treat as temporary. Without it a
# deploy would serve this page under a 502.
#
# No `proxy_intercept_errors` anywhere: these are the errors nginx generates when the
# upstream is unreachable. A 502 or 503 that the application itself returns is its own
# business and is passed through untouched.

error_page 502 503 =503 /__maintenance.html;

location = /__maintenance.html {
    internal;
    alias /var/www/maintenance/maintenance.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 300 always;
}
