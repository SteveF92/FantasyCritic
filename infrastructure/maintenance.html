<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Server Maintenance - Fantasy Critic</title>

    <style>
      :root {
        --gold: #d6993a;
        --panel: rgba(50, 50, 50, 0.7);
        --navbar: #15171a;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #000;
        background-image: var(--fc-texture);
        background-repeat: repeat;
        color: #fff;
        /* The site sets no font-family of its own, so this is Bootstrap 4's native stack. */
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue',
          Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji';
        font-size: 16px;
        line-height: 1.5;
      }

      .top-nav {
        background-color: var(--navbar);
        padding: 8px 16px;
      }

      .logo {
        width: 234px;
        height: 47px;
        background-image: var(--fc-logo);
        background-repeat: no-repeat;
        background-position: left center;
        background-size: contain;
      }

      main {
        flex: 1 0 auto;
        width: 100%;
        max-width: 800px;
        margin: 0 auto;
        padding: 48px 20px;
      }

      .panel {
        background: var(--panel);
        padding: 32px;
      }

      h1 {
        margin: 0 0 16px;
        color: var(--gold);
        font-size: 32px;
        font-weight: bold;
      }

      p {
        margin: 0 0 16px;
      }

      p:last-child {
        margin-bottom: 0;
      }

      a {
        color: var(--gold);
      }

      @media only screen and (max-width: 576px) {
        main {
          padding: 24px 12px;
        }

        .panel {
          padding: 20px;
        }

        h1 {
          font-size: 26px;
        }

        .logo {
          width: 180px;
          height: 36px;
        }
      }
    </style>
  </head>

  <body>
    <nav class="top-nav">
      <div class="logo" role="img" aria-label="Fantasy Critic"></div>
    </nav>

    <main>
      <div class="panel">
        <h1>Server maintenance in progress</h1>

        <p>
          The site is currently down for maintenance. This should take no more than a few minutes. If things seem to be taking a while, you can check our
          <a href="https://discord.gg/dNa7DD3" target="_blank">Discord</a>
          for updates.
        </p>
      </div>
    </main>
